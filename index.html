<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="반려견 걷기 앱 발맞춤의 개인정보 처리방침과 계정 삭제 안내">
<title>발맞춤 안내</title>
<style>:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#1f2421;--muted:#4f5853;--line:#d6d2c8;--card:#fff;--accent:#24603f;--focus:#1b4fd1}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--fg:#e8ebe9;--muted:#b3bcb7;--line:#3a423e;--card:#1c201e;--accent:#8fd3ae;--focus:#9db8ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:12px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto;padding:8px 18px 48px}
header.site,footer.site{max-width:760px;margin:0 auto;padding:14px 18px;color:var(--muted);font-size:.9rem}
header.site a{font-weight:700;text-decoration:none;color:var(--fg)}
footer.site{border-top:1px solid var(--line);padding-bottom:40px}
h1{font-size:1.6rem;line-height:1.3;margin:.3em 0 .6em}
h2{font-size:1.2rem;line-height:1.4;margin:2em 0 .6em;padding-top:.8em;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .5em}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,.table:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;background:var(--card);color:var(--fg);padding:8px 12px;border:2px solid var(--focus);border-radius:6px;z-index:1}
.skip:focus{top:12px}
.toc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 16px 10px;margin:1.4em 0}
.toc h2{border:0;margin:.6em 0 .2em;padding:0;font-size:1rem}
.toc ol{margin:0;padding-left:1.2em;list-style:none}
.toc li{margin:.15em 0}
.toc a{display:inline-block;padding:4px 0;min-height:24px}
.table{overflow-x:auto;margin:0 0 1em;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--line)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{color:var(--muted);font-weight:600;white-space:nowrap}
tbody th{font-weight:600;min-width:6.5em}
@media (max-width:600px){.table table,.table tbody,.table tr,.table th,.table td{display:block;width:auto}.table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.table tr{border-bottom:1px solid var(--line);padding:8px 0}.table tbody tr:last-child{border-bottom:0}.table tbody th,.table td{border:0;padding:3px 12px;min-width:0}.table td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:.82rem;font-weight:600}}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
code{font-size:.9em}
.cards{display:grid;gap:12px;margin:1.2em 0;padding:0;list-style:none}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.cards a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--fg);min-height:44px}
.cards strong{color:var(--accent);display:block;font-size:1.05rem}
.back{margin-top:2.5em;font-size:.9rem}
@media print{.toc,.skip,.back,header.site{display:none}a{color:inherit}}
</style>
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>
<header class="site"><a href="index.html">발맞춤</a></header>
<main id="content">

<li><a href="privacy-policy.html"><strong>개인정보 처리방침</strong>어떤 정보를 왜 받고, 얼마나 두고, 어떻게 지우는지</a></li>

</ul>
</main>
<footer class="site">발맞춤 · 운영 이범석(개인) · 문의 <a href="mailto:beomdolq@gmail.com">beomdolq@gmail.com</a></footer>
</body>
</html>
